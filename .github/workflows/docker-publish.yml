# ──────────────────────────────────────────────────────────────
# VaultRealm — Build & Publish Docker Images to GitHub Container Registry (GHCR)
# Manual trigger only — prevents duplicate automatic runs alongside Docker Hub
# ──────────────────────────────────────────────────────────────

name: Build & Publish Docker Images (GHCR)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Build & Push Realm Image to GHCR ──────────────────────────────────
  realm:
    name: Build & Push Realm Image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VaultRealm
            org.opencontainers.image.description=A lightweight, modern, multi-user control panel for self-hosting game servers
            org.opencontainers.image.vendor=VaultSoft Labs

      - name: Build and push Realm image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLIENT_ID=${{ secrets.CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
          cache-from: type=gha,scope=ghcr-realm
          cache-to: type=gha,mode=max,scope=ghcr-realm
          platforms: linux/amd64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Job 2: Build & Push Companion Bot Image to GHCR ──────────────────────────
  bot:
    name: Build & Push Bot Image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bot-runner
          flavor: |
            latest=false
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VaultRealm Bot Runner
            org.opencontainers.image.description=Autonomous AI Companion Bot Runner for Minecraft servers in VaultRealm
            org.opencontainers.image.vendor=VaultSoft Labs

      - name: Build and push Bot image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/bot-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-bot
          cache-to: type=gha,mode=max,scope=ghcr-bot
          platforms: linux/amd64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bot-runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
