# ──────────────────────────────────────────────────────────────
# VaultRealm — Build & Publish Docker Image to GitHub Container Registry
# Triggers on: push to main, version tags (v*), and manual dispatch
# Publishes to: ghcr.io/hypertextassassinrajith/vaultrealm
# ──────────────────────────────────────────────────────────────

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Buildx (multi-platform support) ─────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GHCR ───────────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract metadata (tags, labels) ────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with "latest" on main branch pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with semver from git tags (v1.2.3 → 1.2.3)
            type=semver,pattern={{version}}
            # Tag with major.minor (v1.2.3 → 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major only (v1.2.3 → 1)
            type=semver,pattern={{major}}
            # Tag with short SHA for traceability
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=VaultRealm
            org.opencontainers.image.description=Self-hosted game server control panel
            org.opencontainers.image.vendor=HypertextAssassinRajith

      # ── Build & Push ───────────────────────────────────────
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ── Attest provenance (supply chain security) ──────────
      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
