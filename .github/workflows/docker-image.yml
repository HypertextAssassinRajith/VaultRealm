name: Publish Docker images to Docker Hub

# Triggers:
#   push to master  -> :edge
#   git tag v*      -> :0.1.7, :0.1, and :latest (clean semver without internal sha or raw '0' tags)
#   PR to master    -> build validation only (push: false)
on:
  push:
    branches: [master]
    tags:
      - "v*"
      - "v*.*.*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REALM_IMAGE: hypertextassassin/vaultrealm
  BOT_IMAGE: hypertextassassin/vaultrealm-bot-runner

jobs:
  # ── Job 1: Build & Push Panel / Realm Image ──────────────────────────────────
  realm:
    name: Build & Push Realm Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REALM_IMAGE }}
          flavor: |
            latest=false
          tags: |
            # Master branch builds get :edge
            type=edge,branch=master
            # Release tag: exact semver (e.g. 0.1.7)
            type=semver,pattern={{version}}
            # Release tag: minor version track (e.g. 0.1)
            type=semver,pattern={{major}}.{{minor}}
            # Release tag: major version only for stable v1+ (e.g. 1, 2)
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Release tag: update latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VaultRealm
            org.opencontainers.image.description=A lightweight, modern, multi-user control panel for self-hosting game servers
            org.opencontainers.image.vendor=VaultSoft Labs

      - name: Build and push Realm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=realm
          cache-to: type=gha,mode=max,scope=realm

      # Re-pushing :latest last ensures it appears at the top of the Docker Hub tag list
      - name: Move latest to the top of the tag list
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version != ''
        run: |
          docker buildx imagetools create \
            -t ${{ env.REALM_IMAGE }}:latest \
            ${{ env.REALM_IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Update Docker Hub repository description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REALM_IMAGE }}
          short-description: "A lightweight, modern, multi-user control panel for self-hosting game servers."
          readme-filepath: ./README.md

  # ── Job 2: Build & Push Companion Bot Runner Image ───────────────────────────
  bot:
    name: Build & Push Bot Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BOT_IMAGE }}
          flavor: |
            latest=false
          tags: |
            # Master branch builds get :edge
            type=edge,branch=master
            # Release tag: exact semver (e.g. 0.1.7)
            type=semver,pattern={{version}}
            # Release tag: minor version track (e.g. 0.1)
            type=semver,pattern={{major}}.{{minor}}
            # Release tag: major version only for stable v1+ (e.g. 1, 2)
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Release tag: update latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VaultRealm Bot Runner
            org.opencontainers.image.description=Autonomous AI Companion Bot Runner for Minecraft servers in VaultRealm
            org.opencontainers.image.vendor=VaultSoft Labs

      - name: Build and push Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/bot-runner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      # Re-pushing :latest last ensures it appears at the top of the Docker Hub tag list
      - name: Move latest to the top of the tag list
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version != ''
        run: |
          docker buildx imagetools create \
            -t ${{ env.BOT_IMAGE }}:latest \
            ${{ env.BOT_IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Update Docker Hub repository description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.BOT_IMAGE }}
          short-description: "Autonomous AI Companion Bot Runner for Minecraft servers in VaultRealm"
          readme-filepath: ./apps/bot-runner/README.md
