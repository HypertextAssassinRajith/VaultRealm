name: Publish Docker images to Docker Hub

# Triggers:
#   push to master  -> hypertextassassin/vaultrealm:edge & :latest
#                      hypertextassassin/vaultrealm-bot-runner:edge & :latest
#   git tag v*      -> :0.1.0, :0.1, :1, and :latest
#   PR to master    -> build validation only (push: false)
on:
  push:
    branches: [master]
    tags:
      - "v*"
      - "v*.*.*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REALM_IMAGE: hypertextassassin/vaultrealm
  BOT_IMAGE: hypertextassassin/vaultrealm-bot-runner
  BOT_ALT_IMAGE: hypertextassassin/bot-runner

jobs:
  # ── Job 1: Build & Push Panel / Realm Image ──────────────────────────────────
  realm:
    name: Build & Push Realm Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REALM_IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=VaultRealm
            org.opencontainers.image.description=Self-hosted game server control panel
            org.opencontainers.image.vendor=HypertextAssassinRajith

      - name: Build and push Realm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=realm
          cache-to: type=gha,mode=max,scope=realm

      # Re-pushing :latest last ensures it is at the top of the Docker Hub tag list
      - name: Move latest to the top of the tag list
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version != ''
        run: |
          docker buildx imagetools create \
            -t ${{ env.REALM_IMAGE }}:latest \
            ${{ env.REALM_IMAGE }}:${{ steps.meta.outputs.version }}

  # ── Job 2: Build & Push Companion Bot Runner Image ───────────────────────────
  bot:
    name: Build & Push Bot Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BOT_IMAGE }}
            ${{ env.BOT_ALT_IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=VaultRealm Bot Runner
            org.opencontainers.image.description=Autonomous AI Companion Bot Runner for Minecraft servers
            org.opencontainers.image.vendor=HypertextAssassinRajith

      - name: Build and push Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/bot-runner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      # Re-pushing :latest last ensures it is at the top of the Docker Hub tag list
      - name: Move latest to the top of the tag list
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version != ''
        run: |
          docker buildx imagetools create \
            -t ${{ env.BOT_IMAGE }}:latest \
            ${{ env.BOT_IMAGE }}:${{ steps.meta.outputs.version }}
          docker buildx imagetools create \
            -t ${{ env.BOT_ALT_IMAGE }}:latest \
            ${{ env.BOT_ALT_IMAGE }}:${{ steps.meta.outputs.version }}
